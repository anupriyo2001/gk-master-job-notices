name: Collect official job notices

on:
  schedule:
    - cron: "7 */2 * * *" # every two hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Read official websites
        run: node collect.mjs
      - name: Publish notices
        run: |
          git config user.name "gk-master-bot"
          git config user.email "gk-master-bot@users.noreply.github.com"
          git add notices state
          if ! git diff --cached --quiet; then
            git commit -m "Official notices $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
